<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chandler Mayo</title>
  <meta name="theme-color" content="#0f0f10">
  <style>
    :root {
      --bg: #f7f7f8;
      --fg: #111;
      --muted: #666;
      --card: #fff;
      --border: #e3e3e6;
      --accent: #111;
      --accent-fg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --fg: #f2f2f3;
        --muted: #9a9aa0;
        --card: #1a1a1c;
        --border: #2a2a2e;
        --accent: #f2f2f3;
        --accent-fg: #0f0f10;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 1.75rem;
      margin: 0 0 32px;
      letter-spacing: -0.02em;
    }
    nav { display: grid; gap: 14px; }
    a {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--border);
      transition: transform .1s ease, opacity .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    a.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }
    a:active { transform: scale(0.98); opacity: .85; }
    a:focus-visible { outline: 3px solid #4c8dff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Chandler Mayo</h1>
    <nav>
      <a class="primary" href="https://tessl.co/kn1">Tessl</a>
      <a href="https://www.linkedin.com/in/chandlermayo/">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
